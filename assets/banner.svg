<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#text-grad); }
      .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.8; stroke-dashoffset: 50; }
      }

      @keyframes signal {
        0% { r: 4px; opacity: 1; }
        100% { r: 28px; opacity: 0; }
      }

      .floating-node { animation: float 6s ease-in-out infinite; }
      .floating-node-delayed { animation: float 7s ease-in-out 2s infinite; }
      .pulse-wire { stroke-dasharray: 8, 8; animation: pulse 4s linear infinite; }
      .signal-ring { animation: signal 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
      .signal-ring-delayed { animation: signal 2.5s cubic-bezier(0, 0.2, 0.8, 1) 1.25s infinite; }
    </style>
  </defs>

  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)"/>

  <g opacity="0.15">
    <path d="M0,100 L1200,100 M0,200 L1200,200 M0,300 L1200,300" stroke="#38bdf8" stroke-width="1"/>
    <path d="M200,0 L200,400 M400,0 L400,400 M600,0 L600,400 M800,0 L800,400 M1000,0 L1000,400" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <g opacity="0.4">
    <path d="M 150 320 Q 350 260 600 320 T 1050 320" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse-wire"/>
    <path d="M 100 80 Q 400 140 700 70 T 1100 100" fill="none" stroke="#818cf8" stroke-width="2" class="pulse-wire"/>
  </g>

  <g class="floating-node" opacity="0.6">
    <circle cx="950" cy="120" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="950" cy="120" class="signal-ring" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <text x="950" y="125" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">DNS</text>
  </g>

  <g class="floating-node-delayed" opacity="0.6">
    <circle cx="1050" cy="260" r="22" fill="#1e293b" stroke="#c084fc" stroke-width="2"/>
    <circle cx="1050" cy="260" class="signal-ring-delayed" fill="none" stroke="#c084fc" stroke-width="2"/>
    <text x="1050" y="265" text-anchor="middle" fill="#c084fc" font-family="sans-serif" font-size="12" font-weight="bold">Anycast</text>
  </g>

  <g transform="translate(80, 140)">
    <text x="0" y="40" class="title" filter="url(#glow)">Awesome Cloud DNS &amp; Traffic Management 🌐 ⚡</text>
    <text x="0" y="90" class="subtitle">Authoritative Servers • GeoDNS Steering • Anycast Routing • DNSSEC • Ad Blocking</text>
  </g>

  <g transform="translate(80, 290)">
    <rect x="0" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" class="badge-text">☁️ Cloud DNS</text>

    <rect x="155" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="235" y="22" text-anchor="middle" class="badge-text">🔀 Traffic Steering</text>

    <rect x="330" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
    <text x="410" y="22" text-anchor="middle" class="badge-text">🛡️ Self-Hosted</text>

    <rect x="505" y="0" width="160" height="34" rx="17" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
    <text x="585" y="22" text-anchor="middle" class="badge-text">🔒 DoH / DoT / DoQ</text>
  </g>
</svg>
